services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-producteurs}
      POSTGRES_USER: ${POSTGRES_USER:-producteurs}
      # Aucun mot de passe dans le dépôt : il vient du fichier .env (non versionné) (R1)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: ${API_IMAGE:-tp2-api:local}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-producteurs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-producteurs}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
